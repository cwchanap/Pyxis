included:
  - Pyxis
  - PyxisTests
  - PyxisUITests

excluded:
  - .git
  - .superpowers
  - .worktrees
  - build
  - DerivedData
  - Pyxis.xcodeproj

disabled_rules:
  - file_length
  - function_body_length
  - identifier_name
  - type_body_length

# "quartermaster" is a normal military role name; it is also the persisted
# TreasuryState key and TreasuryUpgrade raw value, so it cannot be renamed.
inclusive_language:
  override_allowed_terms:
    - quartermaster
