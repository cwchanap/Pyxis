name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Pyxis.xcodeproj
  SCHEME: Pyxis
  DESTINATION: platform=iOS Simulator,name=iPhone 17

jobs:
  build-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build & Lint
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Lint
        run: swiftlint lint --no-cache --reporter github-actions-logging

      - name: Build
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  unit-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Unit Test & Codecov
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify simulator availability
        run: |
          # Warm up CoreSimulator so the iOS runtime is registered before
          # xcodebuild queries destinations. On fresh macos-26 runners the
          # runtime is occasionally not registered yet, which makes xcodebuild
          # fail with "Unable to find a device matching the provided
          # destination specifier" even though the runtime is installed.
          xcrun simctl list devices available
          if ! xcrun simctl list devices available | grep -q "iPhone 17"; then
            echo "::warning::iPhone 17 simulator is not registered yet; tests will retry if needed."
          fi

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          mkdir -p build/TestResults
          # Retry only on the known CoreSimulator/destination startup failure
          # (the runtime is installed but not registered yet on fresh runners).
          # Build/test failures fail immediately so a flaky assertion cannot
          # pass on a later attempt and turn CI green.
          destination_error_pattern='Unable to find a device matching|device matching the provided destination|Simulator runtime.*not (available|found|registered)|Failed to (boot|create).*[Ss]imulator|CoreSimulator.*not available'
          attempt=0
          max_attempts=3
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "::group::Unit test attempt $attempt/$max_attempts"
            rm -rf build/TestResults/Unit.xcresult
            log="build/TestResults/unit-attempt-${attempt}.log"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -enableCodeCoverage YES \
              -resultBundlePath build/TestResults/Unit.xcresult \
              -derivedDataPath build/DerivedData \
              test \
              -only-testing:PyxisTests \
              -skip-testing:PyxisUITests 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $status -eq 0 ]; then
              break
            fi
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::Unit tests failed after $max_attempts attempts (last exit $status)."
              exit $status
            fi
            if grep -qE "$destination_error_pattern" "$log"; then
              echo "Destination/CoreSimulator startup failure detected (exit $status). Re-warming simulator and retrying in 30s..."
              xcrun simctl list devices available
              sleep 30
              continue
            fi
            echo "::error::Unit tests failed (exit $status); not a destination/CoreSimulator startup error, failing immediately."
            exit $status
          done

      - name: Export coverage report
        run: |
          set -o pipefail
          mkdir -p build/coverage
          xcrun xccov view --report build/TestResults/Unit.xcresult > build/coverage/xcode-coverage.txt
          xcrun xccov view --archive build/TestResults/Unit.xcresult \
            | ruby tools/xccov-to-lcov.rb "$GITHUB_WORKSPACE" \
            > build/coverage/pyxis.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: build/coverage/pyxis.lcov
          disable_search: true
          flags: unit
          name: pyxis-unit
          fail_ci_if_error: true

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            build/TestResults/Unit.xcresult
            build/coverage/xcode-coverage.txt
            build/coverage/pyxis.lcov
          if-no-files-found: ignore

  ui-test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: UI Test
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify simulator availability
        run: |
          # Warm up CoreSimulator so the iOS runtime is registered before
          # xcodebuild queries destinations. On fresh macos-26 runners the
          # runtime is occasionally not registered yet, which makes xcodebuild
          # fail with "Unable to find a device matching the provided
          # destination specifier" even though the runtime is installed.
          xcrun simctl list devices available
          if ! xcrun simctl list devices available | grep -q "iPhone 17"; then
            echo "::warning::iPhone 17 simulator is not registered yet; tests will retry if needed."
          fi

      - name: Run UI tests
        run: |
          set -o pipefail
          mkdir -p build/TestResults
          # Retry only on the known CoreSimulator/destination startup failure
          # (see the unit-test step for rationale). Build/test failures fail
          # immediately so a flaky UI assertion cannot turn CI green.
          destination_error_pattern='Unable to find a device matching|device matching the provided destination|Simulator runtime.*not (available|found|registered)|Failed to (boot|create).*[Ss]imulator|CoreSimulator.*not available'
          attempt=0
          max_attempts=3
          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            echo "::group::UI test attempt $attempt/$max_attempts"
            rm -rf build/TestResults/UI.xcresult
            log="build/TestResults/ui-attempt-${attempt}.log"
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -destination "$DESTINATION" \
              -parallel-testing-enabled NO \
              -resultBundlePath build/TestResults/UI.xcresult \
              -derivedDataPath build/DerivedData \
              test \
              -only-testing:PyxisUITests 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $status -eq 0 ]; then
              break
            fi
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::UI tests failed after $max_attempts attempts (last exit $status)."
              exit $status
            fi
            if grep -qE "$destination_error_pattern" "$log"; then
              echo "Destination/CoreSimulator startup failure detected (exit $status). Re-warming simulator and retrying in 30s..."
              xcrun simctl list devices available
              sleep 30
              continue
            fi
            echo "::error::UI tests failed (exit $status); not a destination/CoreSimulator startup error, failing immediately."
            exit $status
          done

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: build/TestResults/UI.xcresult
          if-no-files-found: ignore
